[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msttool"
version = "1.2.2"
description = "All-in-one terminal toolkit for project analysis, Git, networking, diagnostics, and developer utilities."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "MST TEAM"}]
dependencies = ["rich>=13.7,<15", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
test = ["cryptography>=42"]

[project.scripts]
mst = "msttools.app:main"

[project.urls]
Homepage = "https://github.com/Cryvess/MST-Tools"
Repository = "https://github.com/Cryvess/MST-Tools"
Issues = "https://github.com/Cryvess/MST-Tools/issues"

[tool.setuptools]
packages = ["msttools"]
